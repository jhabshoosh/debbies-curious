# The team gate. Dispatch on main:
#   gh workflow run team.yml -f goal="..." -f scenario=pass
#
# `pin`, `publish`, `verdict` and `finish` are trusted: they stage what agents wrote
# from an artifact, outside their own checkout, and never execute it. `red` and
# `test` run PR code with a read-only token, no secrets and no stored credentials.
#
# `lead`, `build` and `review` hold the OAuth token in environment `agents`, so an
# agent must have nothing to reach it with. They have no checkout, so no .git and
# no post step that runs git. They give up sudo and docker first, because code with
# either can read the token from the runner's memory. main's scripts stay outside
# the workspace, in a sandbox that writes only there, with no network.
#
# Checkouts of main use `ref: main`, not the dispatch SHA, so a run that waited
# in the queue starts from the main that earlier runs merged into. P then builds
# on the commit the Lead saw.
#
# With `scenario` set, team/stub.sh stands in for each agent, at no model cost.
# Otherwise each AGENT STEP runs a real agent in a read-only job. A failed agent
# step isn't retried.
name: Team

on:
  workflow_dispatch:
    inputs:
      goal:
        description: What the run should achieve
        required: true
        type: string
      scenario:
        description: Stub scenario to run instead of agents (see team/stub.sh)
        required: false
        type: string
        default: ""

concurrency:
  group: team
  queue: max

permissions: {}

defaults:
  run:
    shell: bash

env:
  RUN_ID: ${{ github.run_id }}
  BRANCH: team/run-${{ github.run_id }}
  SCENARIO: ${{ inputs.scenario }}

jobs:
  lead:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A ceiling. The agent step's own limit comes from team/config.json.
    timeout-minutes: 30
    environment: agents
    permissions:
      contents: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    outputs:
      agent: ${{ steps.result.outputs.agent }}
      base: ${{ steps.export.outputs.base }}
    steps:
      - name: Export main
        id: export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          mkdir "$RUNNER_TEMP/main"
          gh api "repos/$GITHUB_REPOSITORY/tarball/$REF" | tar -xz --strip-components=1 -C "$RUNNER_TEMP/main"
          cp -R "$RUNNER_TEMP/main/." .
          echo "base=$REF" >>"$GITHUB_OUTPUT"

      - name: Remove admin rights
        run: |
          "$RUNNER_TEMP/main/team/agent.sh" sandbox
          "$RUNNER_TEMP/main/team/agent.sh" no-admin

      - name: Lead (stub)
        if: inputs.scenario != ''
        run: '"$RUNNER_TEMP/main/team/stub.sh" lead'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.scenario == ''
        with:
          node-version: 20
          package-manager-cache: false

      - name: Prepare the Lead
        id: prep
        if: inputs.scenario == ''
        env:
          GOAL: ${{ inputs.goal }}
        run: |
          install=$(jq -er .install team/config.json)
          bash -c "$install"
          "$RUNNER_TEMP/main/team/agent.sh" prep lead >>"$GITHUB_OUTPUT"

      # AGENT STEP. Read needs no rule: it works in the workspace and is denied
      # outside it, and a bare `Read` here would approve every path. //proc is an
      # absolute path, because /proc would mean a folder in the workspace.
      - name: Lead
        if: inputs.scenario == ''
        timeout-minutes: ${{ fromJSON(steps.prep.outputs.minutes) }}
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          classify_inline_comments: "false"
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: |
            --max-turns ${{ steps.prep.outputs.turns }}
            --tools Read,Write,Edit,Glob,Grep,Bash
            --allowedTools 'Edit(/team/specs/**),Bash(npx vitest run *),Bash(npx prettier *),Bash(npx eslint *),Bash(npx tsc *)'
            --disallowedTools 'Read(//proc/**),Edit(/.claude/**)'
            --settings '${{ steps.prep.outputs.settings }}'

      # The action writes this file even when it fails, and a limit is one way to fail.
      - name: Read the Lead's result
        id: result
        if: always() && steps.prep.outcome == 'success'
        run: '"$RUNNER_TEMP/main/team/agent.sh" result "$RUNNER_TEMP/claude-execution-output.json" >>"$GITHUB_OUTPUT"'

      # upload-artifact would follow a symlink and hang on a FIFO, outside the sandbox.
      - name: Refuse anything but files
        if: inputs.scenario == ''
        run: '"$RUNNER_TEMP/main/team/agent.sh" files'

      # The whole tree, so a change outside the spec is refused and not just dropped.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lead-tree
          path: |
            .
            !node_modules/**
            !.next/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  pin:
    needs: [lead]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      p: ${{ steps.pin.outputs.p }}
    steps:
      # The commit the Lead saw, because a tree staged on a newer main would read as
      # the Lead reverting it. If main moved, strict checks stop the merge later.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.lead.outputs.base }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lead-tree
          path: ${{ runner.temp }}/lead

      - name: Install gitleaks
        run: team/scan.sh install

      - name: Commit P, scan it, then push
        id: pin
        run: |
          team/scan.sh stage "$RUNNER_TEMP/lead"
          # Only what the Lead's prompt allows. A CLAUDE.md here would reach the Reviewer.
          if git diff --cached --no-renames --name-only |
            grep -vE "^team/specs/$RUN_ID/(spec\.md|[^/]+\.test\.tsx?)$"; then
            echo "::error::The Lead changed paths outside spec.md and tests in team/specs/$RUN_ID"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "spec: team run $RUN_ID"
          # A re-run finds the last attempt's branch, and P has changed.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git push origin --delete "$BRANCH"
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          p=$(git rev-parse HEAD)
          echo "p=$p" >>"$GITHUB_OUTPUT"

      # A separate step, so `finish` has P even if this fails.
      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          GOAL: ${{ inputs.goal }}
        run: gh pr create --base main --head "$BRANCH" --title "Team run $RUN_ID" --body "$GOAL"

  red:
    needs: [pin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs PR code.
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gate
          ref: main
          persist-credentials: false

      - name: Check out P
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          ref: ${{ needs.pin.outputs.p }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Spec tests must fail at P, on an assertion
        run: gate/team/red.sh pr "$RUN_ID" gate/team/config.json

  build:
    needs: [pin, red]
    runs-on: ubuntu-latest
    # A ceiling. The agent step's own limit comes from team/config.json.
    timeout-minutes: 45
    environment: agents
    permissions:
      contents: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    outputs:
      agent: ${{ steps.result.outputs.agent }}
    steps:
      # P has main's team/ unchanged, because `pin` lets only the spec directory through.
      - name: Export P
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.pin.outputs.p }}
        run: |
          mkdir "$RUNNER_TEMP/main"
          gh api "repos/$GITHUB_REPOSITORY/tarball/$REF" | tar -xz --strip-components=1 -C "$RUNNER_TEMP/main"
          cp -R "$RUNNER_TEMP/main/." .

      - name: Remove admin rights
        run: |
          "$RUNNER_TEMP/main/team/agent.sh" sandbox
          "$RUNNER_TEMP/main/team/agent.sh" no-admin

      - name: Builder (stub)
        if: inputs.scenario != ''
        run: '"$RUNNER_TEMP/main/team/stub.sh" build'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.scenario == ''
        with:
          node-version: 20
          package-manager-cache: false

      - name: Prepare the Builder
        id: prep
        if: inputs.scenario == ''
        env:
          GOAL: ${{ inputs.goal }}
        run: |
          install=$(jq -er .install team/config.json)
          bash -c "$install"
          "$RUNNER_TEMP/main/team/agent.sh" prep build >>"$GITHUB_OUTPUT"

      # AGENT STEP. See the Lead for the rules.
      - name: Builder
        if: inputs.scenario == ''
        timeout-minutes: ${{ fromJSON(steps.prep.outputs.minutes) }}
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          classify_inline_comments: "false"
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: |
            --max-turns ${{ steps.prep.outputs.turns }}
            --tools Read,Write,Edit,Glob,Grep,Bash
            --allowedTools 'Edit(/**),Bash'
            --disallowedTools 'Read(//proc/**),Edit(/.claude/**)'
            --settings '${{ steps.prep.outputs.settings }}'

      - name: Read the Builder's result
        id: result
        if: always() && steps.prep.outcome == 'success'
        run: '"$RUNNER_TEMP/main/team/agent.sh" result "$RUNNER_TEMP/claude-execution-output.json" >>"$GITHUB_OUTPUT"'

      # upload-artifact would follow a symlink and hang on a FIFO, outside the sandbox.
      - name: Refuse anything but files
        if: inputs.scenario == ''
        run: '"$RUNNER_TEMP/main/team/agent.sh" files'

      # The whole tree, so a change outside the spec is refused and not just dropped.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-tree
          path: |
            .
            !node_modules/**
            !.next/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [pin, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted.
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pin.outputs.p }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-tree
          path: ${{ runner.temp }}/build

      - name: Install gitleaks
        run: team/scan.sh install

      - name: Stage the tree, scan it, then push
        id: publish
        env:
          P: ${{ needs.pin.outputs.p }}
        run: |
          team/scan.sh stage "$RUNNER_TEMP/build"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: team run $RUN_ID"
          git push origin "HEAD:refs/heads/$BRANCH"
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          # The Reviewer has no repo, so what it reads comes from here.
          mkdir "$RUNNER_TEMP/review"
          cp -R "team/specs/$RUN_ID" "$RUNNER_TEMP/review/spec"
          git diff --text "$P" HEAD >"$RUNNER_TEMP/review/change.diff"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-input
          path: ${{ runner.temp }}/review
          if-no-files-found: error
          retention-days: 1

  test:
    needs: [pin, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs PR code, through gate.sh and only after its checks pass.
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gate
          ref: main
          persist-credentials: false

      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install gitleaks
        run: gate/team/scan.sh install

      - name: Run the gate from main
        env:
          P: ${{ needs.pin.outputs.p }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: gate/team/gate.sh pr "$P" "$SHA" gate/team/config.json

  review:
    needs: [publish, test]
    runs-on: ubuntu-latest
    # A ceiling. The agent step's own limit comes from team/config.json.
    timeout-minutes: 20
    environment: agents
    permissions:
      contents: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    outputs:
      agent: ${{ steps.result.outputs.agent }}
      blocking: ${{ steps.stub.outputs.blocking || steps.result.outputs.blocking }}
    steps:
      - name: Export main
        env:
          GH_TOKEN: ${{ github.token }}
          REF: main
        run: |
          mkdir "$RUNNER_TEMP/main"
          gh api "repos/$GITHUB_REPOSITORY/tarball/$REF" | tar -xz --strip-components=1 -C "$RUNNER_TEMP/main"

      # The Reviewer has no Bash, so it needs no sandbox.
      - name: Remove admin rights
        run: '"$RUNNER_TEMP/main/team/agent.sh" no-admin'

      - name: Reviewer (stub)
        id: stub
        if: inputs.scenario != ''
        run: '"$RUNNER_TEMP/main/team/stub.sh" review'

      # Agents start in the workspace, so this one holds only the goal, spec and diff.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.scenario == ''
        with:
          name: review-input
          path: ${{ github.workspace }}

      - name: Prepare the Reviewer
        id: prep
        if: inputs.scenario == ''
        env:
          GOAL: ${{ inputs.goal }}
        run: |
          "$RUNNER_TEMP/main/team/agent.sh" prep review >>"$GITHUB_OUTPUT"
          [ "$(ls -A | wc -l)" -eq 3 ]

      # AGENT STEP
      - name: Reviewer
        if: inputs.scenario == ''
        timeout-minutes: ${{ fromJSON(steps.prep.outputs.minutes) }}
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          classify_inline_comments: "false"
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: |
            --max-turns ${{ steps.prep.outputs.turns }}
            --tools Read,Grep,Glob
            --disallowedTools 'mcp__*,Read(//proc/**)'
            --json-schema '${{ steps.prep.outputs.schema }}'

      - name: Read the Reviewer's result
        id: result
        if: always() && steps.prep.outcome == 'success'
        run: |
          "$RUNNER_TEMP/main/team/agent.sh" result \
            "$RUNNER_TEMP/claude-execution-output.json" review >>"$GITHUB_OUTPUT"

  verdict:
    if: always()
    needs: [lead, build, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Trusted.
    permissions: {}
    outputs:
      verdict: ${{ steps.decide.outputs.verdict }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Decide
        id: decide
        env:
          LEAD_AGENT: ${{ needs.lead.outputs.agent }}
          BUILD_AGENT: ${{ needs.build.outputs.agent }}
          REVIEW_AGENT: ${{ needs.review.outputs.agent }}
          REVIEW_RESULT: ${{ needs.review.result }}
          BLOCKING: ${{ needs.review.outputs.blocking }}
        run: |
          # What each agent's execution file showed comes first, so a usage limit
          # never reads as a bad review. A failure stops the run, so at most one is set.
          verdict=blocked
          reason=
          for agent in "lead=$LEAD_AGENT" "build=$BUILD_AGENT" "review=$REVIEW_AGENT"; do
            case "$agent" in
              *=limit) reason="usage limit in ${agent%=*}" ;;
              *=failed) reason="agent failed in ${agent%=*}" ;;
              *=invalid) reason="invalid review output" ;;
            esac
          done

          if [ -n "$reason" ]; then
            :
          elif [ "$REVIEW_RESULT" != success ]; then
            reason="stopped before review"
          elif [ "$BLOCKING" = 0 ]; then
            verdict=pass
            reason="no blocking findings"
          else
            reason="blocking findings: $BLOCKING"
          fi
          echo "verdict=$verdict" >>"$GITHUB_OUTPUT"
          echo "reason=$reason" >>"$GITHUB_OUTPUT"

  finish:
    if: always()
    needs: [lead, pin, red, build, publish, test, review, verdict]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted. Runs no checkout, so it has no PR code to execute.
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
    steps:
      - name: Post team-gate, then merge or close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The PR head: the candidate once published, otherwise P.
          HEAD_SHA: ${{ needs.publish.outputs.sha || needs.pin.outputs.p }}
          # Only the test job can make the check green. The Reviewer can only stop it.
          TEST_RESULT: ${{ needs.test.result }}
          VERDICT: ${{ needs.verdict.outputs.verdict }}
          REASON: ${{ needs.verdict.outputs.reason }}
          RESULTS: >-
            lead=${{ needs.lead.result }}
            pin=${{ needs.pin.result }}
            red=${{ needs.red.result }}
            build=${{ needs.build.result }}
            publish=${{ needs.publish.result }}
            test=${{ needs.test.result }}
            review=${{ needs.review.result }}
            verdict=${{ needs.verdict.outputs.verdict }}
        run: |
          # No -e: every failure below must still reach the close.
          set +e

          post_check() {
            [ -n "$HEAD_SHA" ] && gh api --method POST "repos/$GH_REPO/check-runs" \
              -f name=team-gate \
              -f head_sha="$HEAD_SHA" \
              -f status=completed \
              -f conclusion="$1" \
              -f "output[title]=$1" \
              -f "output[summary]=$RESULTS (${REASON:-no reason})"
          }

          conclusion=failure
          if [ "$TEST_RESULT" = success ] && [ "$VERDICT" = pass ]; then
            conclusion=success
          fi

          if post_check "$conclusion" && [ "$conclusion" = success ]; then
            # --delete-branch can fail after the merge lands, so a non-zero exit
            # isn't proof that it didn't.
            if gh pr merge "$BRANCH" --repo "$GH_REPO" --squash --delete-branch \
              --match-head-commit "$HEAD_SHA" ||
              [ "$(gh pr view "$BRANCH" --repo "$GH_REPO" --json state --jq .state)" = MERGED ]; then
              echo "MERGED: $RESULTS" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # A merge needs the green check first, so take it back if the merge can't land.
            post_check failure
          fi

          # Name the job that stopped the run, so a scenario claims only what it shows.
          # tamper-workflow may stop at publish, if GitHub refuses the push, and not
          # reach the gate at all.
          blocked_at=merge
          for result in $RESULTS; do
            case "$result" in
              *=failure | *=cancelled | *=skipped | *=blocked)
                blocked_at=${result%%=*}
                break
                ;;
            esac
          done
          outcome="BLOCKED at $blocked_at, ${REASON:-no reason} (scenario: ${SCENARIO:-none}): $RESULTS"

          # With no PR to close, as when gh pr create failed, remove the branch directly.
          gh pr close "$BRANCH" --repo "$GH_REPO" --delete-branch --comment "$outcome" ||
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH"
          echo "$outcome" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      # Public until deleted, and retention removes any that survive this.
      - name: Delete this run's artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].id' |
            while read -r id; do
              gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
            done
