# The team gate. Dispatch on main:
#   gh workflow run team.yml -f goal="..." -f scenario=pass
#
# `pin`, `publish`, `verdict` and `finish` are trusted: they stage what agents
# wrote from an artifact, as data, outside their own checkout, and never execute
# it. `red` and `test` run PR code with a read-only token, no secrets and no stored
# credentials. `lead` and `build` are untrusted too: a real agent runs its own code
# there, beside the OAuth token in environment `agents`.
#
# A job holding that token runs nothing the agent could have written. Memory of
# the runner process holds the token, and a later step could read it with sudo.
# So after an agent step, only a copy of agent.sh taken before it and the upload run.
#
# Checkouts of main use `ref: main`, not the dispatch SHA, so a run that waited
# in the queue starts from the main that earlier runs merged into.
#
# With `scenario` set, team/stub.sh stands in for each agent, at no model cost.
# Otherwise each AGENT STEP runs a real agent in a read-only job. A failed agent
# step isn't retried.
name: Team

on:
  workflow_dispatch:
    inputs:
      goal:
        description: What the run should achieve
        required: true
        type: string
      scenario:
        description: Stub scenario to run instead of agents (see team/stub.sh)
        required: false
        type: string
        default: ""

concurrency:
  group: team
  queue: max

permissions: {}

defaults:
  run:
    shell: bash

env:
  RUN_ID: ${{ github.run_id }}
  BRANCH: team/run-${{ github.run_id }}
  SCENARIO: ${{ inputs.scenario }}
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lead:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A ceiling. The agent step's own limit comes from team/config.json.
    timeout-minutes: 30
    environment: agents
    permissions:
      contents: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    outputs:
      agent: ${{ steps.result.outputs.agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Lead (stub)
        if: inputs.scenario != ''
        run: team/stub.sh lead

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.scenario == ''
        with:
          node-version: 20
          package-manager-cache: false

      # The scrub only clears subprocess environments. Bubblewrap adds the PID
      # namespace that stops Bash reading the OAuth token from /proc, and the action
      # installs it only for allowed_non_write_users.
      - name: Isolate agent subprocesses
        if: inputs.scenario == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Prepare the Lead
        id: prep
        if: inputs.scenario == ''
        env:
          GOAL: ${{ inputs.goal }}
        run: |
          install=$(jq -er .install team/config.json)
          bash -c "$install"
          cp team/agent.sh "$RUNNER_TEMP/agent.sh"
          team/agent.sh prep lead >>"$GITHUB_OUTPUT"

      # AGENT STEP. Read needs no rule: it works in the workspace and is denied
      # outside it, and a bare `Read` here would approve every path. //proc is an
      # absolute path, because /proc would mean a folder in the workspace.
      - name: Lead
        if: inputs.scenario == ''
        timeout-minutes: ${{ fromJSON(steps.prep.outputs.minutes) }}
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          classify_inline_comments: "false"
          settings: ${{ steps.prep.outputs.settings }}
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: |
            --max-turns ${{ steps.prep.outputs.turns }}
            --tools Read,Write,Edit,Glob,Grep,Bash
            --allowedTools 'Edit(/team/specs/**),Bash(npx vitest run *),Bash(npx prettier *),Bash(npx eslint *),Bash(npx tsc *)'
            --disallowedTools 'Read(//proc/**),Edit(/.git/**)'

      # The action writes this file even when it fails, and a limit is one way to fail.
      - name: Read the Lead's result
        id: result
        if: always() && steps.prep.outcome == 'success'
        run: '"$RUNNER_TEMP/agent.sh" result "$RUNNER_TEMP/claude-execution-output.json" >>"$GITHUB_OUTPUT"'

      # The whole tree, so a change outside the spec is refused and not just dropped.
      # Zip drops exec bits, and the trusted job that stages it keeps them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lead-tree
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  pin:
    needs: [lead]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      p: ${{ steps.pin.outputs.p }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lead-tree
          path: ${{ runner.temp }}/lead

      - name: Download gitleaks
        run: |
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Commit P, scan it, then push
        id: pin
        run: |
          # The tree stays outside this checkout, so nothing an agent wrote lands here.
          git -c core.fileMode=false --work-tree="$RUNNER_TEMP/lead" add -A
          # Only what the Lead's prompt allows. A CLAUDE.md here would reach the Reviewer.
          if git diff --cached --no-renames --name-only |
            grep -vE "^team/specs/$RUN_ID/(spec\.md|[^/]+\.test\.tsx?)$"; then
            echo "::error::The Lead changed paths outside spec.md and tests in team/specs/$RUN_ID"
            exit 1
          fi
          if git diff --cached --no-renames --raw | grep -E '^:[0-9]+ 120000 '; then
            echo "::error::The Lead wrote a symlink"
            exit 1
          fi
          # Scan before pushing, as in `publish`.
          mkdir "$RUNNER_TEMP/scan"
          git diff --cached --text -U0 >"$RUNNER_TEMP/scan/candidate.diff"
          (cd "$RUNNER_TEMP/scan" && gitleaks dir --no-banner --redact --ignore-gitleaks-allow .)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "spec: team run $RUN_ID"
          # A re-run finds the last attempt's branch, and P has changed.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git push origin --delete "$BRANCH"
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          p=$(git rev-parse HEAD)
          echo "p=$p" >>"$GITHUB_OUTPUT"

      # A separate step, so `finish` has P even if this fails.
      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          GOAL: ${{ inputs.goal }}
        run: gh pr create --base main --head "$BRANCH" --title "Team run $RUN_ID" --body "$GOAL"

  red:
    needs: [pin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs PR code.
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gate
          ref: main
          persist-credentials: false

      - name: Check out P
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          ref: ${{ needs.pin.outputs.p }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Spec tests must fail at P, on an assertion
        run: gate/team/red.sh pr "$RUN_ID" gate/team/config.json

  build:
    needs: [pin, red]
    runs-on: ubuntu-latest
    # A ceiling. The agent step's own limit comes from team/config.json.
    timeout-minutes: 45
    environment: agents
    permissions:
      contents: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    outputs:
      agent: ${{ steps.result.outputs.agent }}
    steps:
      # At the workspace root, where agents start. P has main's team/ unchanged,
      # because `pin` lets only the spec directory through.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pin.outputs.p }}
          persist-credentials: false

      - name: Builder (stub)
        if: inputs.scenario != ''
        run: team/stub.sh build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.scenario == ''
        with:
          node-version: 20
          package-manager-cache: false

      # The scrub only clears subprocess environments. Bubblewrap adds the PID
      # namespace that stops Bash reading the OAuth token from /proc, and the action
      # installs it only for allowed_non_write_users.
      - name: Isolate agent subprocesses
        if: inputs.scenario == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Prepare the Builder
        id: prep
        if: inputs.scenario == ''
        run: |
          install=$(jq -er .install team/config.json)
          bash -c "$install"
          cp team/agent.sh "$RUNNER_TEMP/agent.sh"
          team/agent.sh prep build >>"$GITHUB_OUTPUT"

      # AGENT STEP. See the Lead for the rules.
      - name: Builder
        if: inputs.scenario == ''
        timeout-minutes: ${{ fromJSON(steps.prep.outputs.minutes) }}
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          classify_inline_comments: "false"
          settings: ${{ steps.prep.outputs.settings }}
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: |
            --max-turns ${{ steps.prep.outputs.turns }}
            --tools Read,Write,Edit,Glob,Grep,Bash
            --allowedTools 'Edit(/**),Bash'
            --disallowedTools 'Read(//proc/**),Edit(/.git/**)'

      - name: Read the Builder's result
        id: result
        if: always() && steps.prep.outcome == 'success'
        run: '"$RUNNER_TEMP/agent.sh" result "$RUNNER_TEMP/claude-execution-output.json" >>"$GITHUB_OUTPUT"'

      # The whole tree, so a change outside the spec is refused and not just dropped.
      # Zip drops exec bits, and the trusted job that stages it keeps them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-tree
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [pin, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted.
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pin.outputs.p }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-tree
          path: ${{ runner.temp }}/build

      - name: Download gitleaks
        run: |
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Stage the tree, scan it, then push
        id: publish
        run: |
          # The tree stays outside this checkout, so nothing an agent wrote lands here.
          git -c core.fileMode=false --work-tree="$RUNNER_TEMP/build" add -A
          # This repo is public, so a secret must never reach a branch. The scan
          # runs outside the checkout on a text diff, so a .gitleaks.toml,
          # .gitleaksignore or .gitattributes in the patch can't exempt the patch.
          mkdir "$RUNNER_TEMP/scan"
          git diff --cached --text -U0 >"$RUNNER_TEMP/scan/candidate.diff"
          (cd "$RUNNER_TEMP/scan" && gitleaks dir --no-banner --redact --ignore-gitleaks-allow .)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: team run $RUN_ID"
          git push origin "HEAD:refs/heads/$BRANCH"
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  test:
    needs: [pin, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs PR code, through gate.sh and only after its checks pass.
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gate
          ref: main
          persist-credentials: false

      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Download gitleaks
        run: |
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Run the gate from main
        env:
          P: ${{ needs.pin.outputs.p }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: gate/team/gate.sh pr "$P" "$SHA" gate/team/config.json

  review:
    needs: [pin, publish, test]
    runs-on: ubuntu-latest
    # A ceiling. The agent step's own limit comes from team/config.json.
    timeout-minutes: 20
    environment: agents
    permissions:
      contents: read
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    outputs:
      agent: ${{ steps.result.outputs.agent }}
      blocking: ${{ steps.stub.outputs.blocking || steps.result.outputs.blocking }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gate
          ref: main
          persist-credentials: false

      - name: Reviewer (stub)
        id: stub
        if: inputs.scenario != ''
        run: gate/team/stub.sh review

      - name: Check out the candidate
        if: inputs.scenario == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Agents start in the workspace, so this one holds only the spec and the diff.
      - name: Empty the workspace for the Reviewer
        id: prep
        if: inputs.scenario == ''
        env:
          P: ${{ needs.pin.outputs.p }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          mv gate "$RUNNER_TEMP/gate"
          mv "pr/team/specs/$RUN_ID" spec
          git -C pr diff --text "$P" "$SHA" >change.diff
          rm -rf pr
          git init -q
          [ "$(ls -A | wc -l)" -eq 3 ]
          "$RUNNER_TEMP/gate/team/agent.sh" prep review >>"$GITHUB_OUTPUT"

      # AGENT STEP
      - name: Reviewer
        if: inputs.scenario == ''
        timeout-minutes: ${{ fromJSON(steps.prep.outputs.minutes) }}
        uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          classify_inline_comments: "false"
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: |
            --max-turns ${{ steps.prep.outputs.turns }}
            --tools Read,Grep,Glob
            --disallowedTools 'mcp__*,Read(//proc/**)'
            --json-schema '${{ steps.prep.outputs.schema }}'

      - name: Read the Reviewer's result
        id: result
        if: always() && steps.prep.outcome == 'success'
        run: |
          "$RUNNER_TEMP/gate/team/agent.sh" result \
            "$RUNNER_TEMP/claude-execution-output.json" review >>"$GITHUB_OUTPUT"

  verdict:
    if: always()
    needs: [lead, build, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Trusted.
    permissions: {}
    outputs:
      verdict: ${{ steps.decide.outputs.verdict }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Decide
        id: decide
        env:
          LEAD_AGENT: ${{ needs.lead.outputs.agent }}
          BUILD_AGENT: ${{ needs.build.outputs.agent }}
          REVIEW_AGENT: ${{ needs.review.outputs.agent }}
          REVIEW_RESULT: ${{ needs.review.result }}
          BLOCKING: ${{ needs.review.outputs.blocking }}
        run: |
          # What each agent's execution file showed comes first, so a usage limit
          # never reads as a bad review. A failure stops the run, so at most one is set.
          verdict=blocked
          reason=
          for agent in "lead=$LEAD_AGENT" "build=$BUILD_AGENT" "review=$REVIEW_AGENT"; do
            case "$agent" in
              *=limit) reason="usage limit in ${agent%=*}" ;;
              *=failed) reason="agent failed in ${agent%=*}" ;;
              *=invalid) reason="invalid review output" ;;
            esac
          done

          if [ -n "$reason" ]; then
            :
          elif [ "$REVIEW_RESULT" != success ]; then
            reason="stopped before review"
          elif [ "$BLOCKING" = 0 ]; then
            verdict=pass
            reason="no blocking findings"
          else
            reason="blocking findings: $BLOCKING"
          fi
          echo "verdict=$verdict" >>"$GITHUB_OUTPUT"
          echo "reason=$reason" >>"$GITHUB_OUTPUT"

  finish:
    if: always()
    needs: [lead, pin, red, build, publish, test, review, verdict]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted. Runs no checkout, so it has no PR code to execute.
    permissions:
      checks: write
      contents: write
      pull-requests: write
    steps:
      - name: Post team-gate, then merge or close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The PR head: the candidate once published, otherwise P.
          HEAD_SHA: ${{ needs.publish.outputs.sha || needs.pin.outputs.p }}
          # Only the test job can make the check green. The Reviewer can only stop it.
          TEST_RESULT: ${{ needs.test.result }}
          VERDICT: ${{ needs.verdict.outputs.verdict }}
          REASON: ${{ needs.verdict.outputs.reason }}
          RESULTS: >-
            lead=${{ needs.lead.result }}
            pin=${{ needs.pin.result }}
            red=${{ needs.red.result }}
            build=${{ needs.build.result }}
            publish=${{ needs.publish.result }}
            test=${{ needs.test.result }}
            review=${{ needs.review.result }}
            verdict=${{ needs.verdict.outputs.verdict }}
        run: |
          # No -e: every failure below must still reach the close.
          set +e

          post_check() {
            [ -n "$HEAD_SHA" ] && gh api --method POST "repos/$GH_REPO/check-runs" \
              -f name=team-gate \
              -f head_sha="$HEAD_SHA" \
              -f status=completed \
              -f conclusion="$1" \
              -f "output[title]=$1" \
              -f "output[summary]=$RESULTS (${REASON:-no reason})"
          }

          conclusion=failure
          if [ "$TEST_RESULT" = success ] && [ "$VERDICT" = pass ]; then
            conclusion=success
          fi

          if post_check "$conclusion" && [ "$conclusion" = success ]; then
            # --delete-branch can fail after the merge lands, so a non-zero exit
            # isn't proof that it didn't.
            if gh pr merge "$BRANCH" --repo "$GH_REPO" --squash --delete-branch \
              --match-head-commit "$HEAD_SHA" ||
              [ "$(gh pr view "$BRANCH" --repo "$GH_REPO" --json state --jq .state)" = MERGED ]; then
              echo "MERGED: $RESULTS" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # A merge needs the green check first, so take it back if the merge can't land.
            post_check failure
          fi

          # Name the job that stopped the run, so a scenario claims only what it shows.
          # tamper-workflow may stop at publish, if GitHub refuses the push, and not
          # reach the gate at all.
          blocked_at=merge
          for result in $RESULTS; do
            case "$result" in
              *=failure | *=cancelled | *=skipped | *=blocked)
                blocked_at=${result%%=*}
                break
                ;;
            esac
          done
          outcome="BLOCKED at $blocked_at, ${REASON:-no reason} (scenario: ${SCENARIO:-none}): $RESULTS"

          # With no PR to close, as when gh pr create failed, remove the branch directly.
          gh pr close "$BRANCH" --repo "$GH_REPO" --delete-branch --comment "$outcome" ||
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH"
          echo "$outcome" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
