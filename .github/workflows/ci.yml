name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit & integration tests
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          LLM_PROVIDER: openai
          OPENAI_API_KEY: sk-test-dummy-key-for-build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          LLM_PROVIDER: openai
          OPENAI_API_KEY: sk-test-dummy-key-for-e2e

  # Runs on Linux because the gate does. A bug in how git reads a pipe passed on
  # macOS and stopped every real run.
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test the team gate
        run: bash team/test-gate.sh
